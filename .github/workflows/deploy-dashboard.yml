name: Deploy Public Stock Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_run:
    workflows: ['Verified SEC Ownership Data', 'Latest Annual Financial Score Inputs', 'Latest Institutional Ownership Refresh', 'US Equity Snapshot & Daily Refresh']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload HTML dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
