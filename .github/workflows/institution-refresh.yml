name: Latest Institutional Ownership Refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/institution-refresh.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-institutional-refresh
  cancel-in-progress: false
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OWNERSHIP_PER_RUN: '120'
      OWNERSHIP_PAUSE_SEC: '0.35'
      OWNERSHIP_MAX_SECONDS: '900'
      OWNERSHIP_PRIORITY_TICKERS: 'ECO,VLO,MPC,INSW,PSX,DT,FRO,OKTA,NTAP,CRWD,PRLB'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data dependencies
        run: pip install -r requirements.txt
      - name: Verify report-date and missing-data rules
        run: python -m unittest discover -s tests -p 'test_ownership.py' -v
      # Use latest available disclosures even for the 2026-10-09 price snapshot.
      # Compare with the previous comparable reporting quarter; never treat missing history as zero change.
      - name: Refresh latest available institution disclosures and comparable changes
        run: python scripts/ownership.py
      - name: Commit verified institutional observations
        shell: bash
        run: |
          # Publish the independent cache; the dashboard overlays it on price data.
          git restore -- docs/data/latest.json docs/data/snapshots/2026-10-09.json
          git add docs/data/institutional.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh latest institution reports [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No institutional data changes'
          fi
