name: Validate Investment Data Pipeline
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/rules.html'
      - 'docs/data/latest.json'
      - '.github/workflows/validate-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate liquidity-first screen, OHLCV cache and institutional reports
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate rules dashboard with real market snapshot
        run: node tests/rules_smoke.cjs
